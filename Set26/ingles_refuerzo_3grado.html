    let comodinUsado = false;
    let logDudas = {};

    function trackDuda(id) {
        logDudas[id] = (logDudas[id] || 0) + 1;
        if (window.navigator && window.navigator.vibrate) {
            window.navigator.vibrate(20);
        }
    }

    function renderQuiz() {
        const container = document.getElementById('quizContainer');
        let questionCounter = 1;
        examData.sections.forEach(section => {
            const header = document.createElement('div');
            header.className = 'section-header';
            header.innerText = section.title;
            container.appendChild(header);

            const layoutDiv = document.createElement('div');
            layoutDiv.className = 'main-layout';

            const questionsColumn = document.createElement('div');
            questionsColumn.className = 'questions-column';

            section.questions.forEach(q => {
                const secDiv = document.createElement('div');
                secDiv.className = 'section';
                secDiv.id = 'sec_' + q.id;

                const titleSpan = document.createElement('span');
                titleSpan.className = 'question-title';
                titleSpan.innerText = `${questionCounter}. ${q.question}`;
                secDiv.appendChild(titleSpan);

                const transSpan = document.createElement('span');
                transSpan.className = 'question-translation';
                transSpan.innerText = `🇵🇪 Traducción: ${q.es}`;
                secDiv.appendChild(transSpan);

                if (q.hasDiagram) {
                    const diagDiv = document.createElement('div');
                    diagDiv.className = 'diagram-container';

                    if (q.hasDiagram === 'catRule') {
                        diagDiv.innerHTML = `
                            <svg class="diagram-svg" width="220" height="90" viewBox="0 0 220 90">
                                <rect x="10" y="10" width="200" height="70" rx="10" fill="#fff" stroke="#8e44ad" stroke-width="2"/>
                                <text x="35" y="45" font-size="28">🐱</text>
                                <text x="75" y="40" font-size="12" font-weight="bold" fill="#2c3e50">HE / SHE / IT</text>
                                <text x="75" y="60" font-size="14" font-weight="bold" fill="#e74c3c">➔ LIKE + S = LIKES</text>
                            </svg>
                        `;
                    } else if (q.hasDiagram === 'thiefRule') {
                        diagDiv.innerHTML = `
                            <svg class="diagram-svg" width="240" height="90" viewBox="0 0 240 90">
                                <rect x="10" y="10" width="220" height="70" rx="10" fill="#fff3e0" stroke="#f39c12" stroke-width="2"/>
                                <text x="120" y="35" font-size="12" font-weight="bold" fill="#d35400" text-anchor="middle">🧲 EL IMÁN DE LA S</text>
                                <text x="120" y="60" font-size="13" font-weight="bold" fill="#2c3e50" text-anchor="middle">DOESN'T + <tspan fill="#27ae60">LIKE</tspan> (¡sin S!)</text>
                            </svg>
                        `;
                    } else if (q.hasDiagram === 'shortAnswer') {
                        diagDiv.innerHTML = `
                            <svg class="diagram-svg" width="220" height="90" viewBox="0 0 220 90">
                                <rect x="10" y="10" width="200" height="70" rx="10" fill="#e8f8f5" stroke="#2ecc71" stroke-width="2"/>
                                <text x="110" y="35" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">RESPUESTAS CORTAS</text>
                                <text x="110" y="55" font-size="12" fill="#2c3e50" text-anchor="middle">✔️ Yes, he/she <tspan font-weight="bold" fill="#27ae60">DOES</tspan>.</text>
                                <text x="110" y="72" font-size="12" fill="#2c3e50" text-anchor="middle">❌ No, he/she <tspan font-weight="bold" fill="#e74c3c">DOESN'T</tspan>.</text>
                            </svg>
                        `;
                    }
                    secDiv.appendChild(diagDiv);
                }

                if (q.type === 'choice') {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'options';
                    optDiv.id = 'opts_' + q.id;
                    q.options.forEach(opt => {
                        const lbl = document.createElement('label');
                        lbl.innerHTML = `<input type="radio" name="${q.id}" value="${opt}" onclick="trackDuda('${q.id}'); saveProgress('${q.id}', '${opt}')"> ${opt}`;
                        optDiv.appendChild(lbl);
                    });
                    secDiv.appendChild(optDiv);
                } else {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.id = q.id;
                    input.placeholder = 'Type your answer in English here...';
                    input.oninput = function() { trackDuda(q.id); saveProgress(q.id, this.value); };
                    secDiv.appendChild(input);
                }
                questionsColumn.appendChild(secDiv);
                questionCounter++;
            });

            const visualCard = document.createElement('div');
            visualCard.className = 'visual-side-card';
            visualCard.innerHTML = `<span class="visual-emoji">${section.emoji}</span><span class="visual-tag">${section.tag}</span><p style="font-size:0.85em; color:#555; margin-top:10px;">¡Edward, tú puedes! Recuerda: en afirmativo ponle la <strong>S</strong> a He/She, pero con <strong>Doesn't</strong> y <strong>Does</strong> déjalo limpio.</p>`;
            layoutDiv.appendChild(questionsColumn);
            layoutDiv.appendChild(visualCard);
            container.appendChild(layoutDiv);
        });
        loadSavedProgress();
    }

    function saveProgress(id, val) {
        localStorage.setItem('set26_ingles_refuerzo_' + id, val);
        document.getElementById('sec_' + id).classList.remove('incomplete');
        if(document.querySelectorAll('.incomplete').length === 0) document.getElementById('missing-msg').style.display='none';
    }

    function loadSavedProgress() {
        examData.sections.forEach(section => {
            section.questions.forEach(q => {
                const saved = localStorage.getItem('set26_ingles_refuerzo_' + q.id);
                if (saved) {
                    if (q.type === 'choice') {
                        const radio = document.querySelector(`input[name="${q.id}"][value="${saved}"]`);
                        if (radio) radio.checked = true;
                    } else {
                        const txtInput = document.getElementById(q.id);
                        if (txtInput) txtInput.value = saved;
                    }
                }
            });
        });
    }

    function usarCincuentaCincuentaGlobal() {
        if (comodinUsado) return;
        let seleccionada = prompt("Edward, escribe el número de pregunta (1 al 40) donde quieras descartar una alternativa incorrecta:");
        let qNum = parseInt(seleccionada);
        if (isNaN(qNum) || qNum < 1 || qNum > 40) return;
        let currentIdx = 1, targetId = null, targetQObj = null;
        for (let s of examData.sections) {
            for (let q of s.questions) {
                if (currentIdx === qNum) { targetId = q.id; targetQObj = q; break; }
                currentIdx++;
            }
            if (targetId) break;
        }
        if (!targetQObj || targetQObj.type !== 'choice') {
            alert("Elige una pregunta de opción múltiple.");
            return;
        }
        let labels = document.getElementById('opts_' + targetId).querySelectorAll('label');
        let incorrectasBorradas = 0;
        labels.forEach(lbl => {
            let radio = lbl.querySelector('input');
            if (radio.value !== targetQObj.correct && incorrectasBorradas < 1) { 
                lbl.style.display = 'none'; 
                incorrectasBorradas++; 
            }
        });
        comodinUsado = true;
        document.getElementById('global-5050').disabled = true;
        document.getElementById('global-5050').innerText = "⚡ Comodín 50/50 Usado";
        if (window.navigator && window.navigator.vibrate) window.navigator.vibrate([40, 40, 40]);
    }

    function validarExamen() {
        let vacios = [];
        examData.sections.forEach(section => {
            section.questions.forEach(q => {
                let r = q.type === 'choice' ? document.querySelector(`input[name="${q.id}"]:checked`) : document.getElementById(q.id).value.trim();
                if (!r) { const c = document.getElementById('sec_' + q.id); c.classList.add('incomplete'); vacios.push(c); }
            });
        });
        if (vacios.length > 0) {
            document.getElementById('missing-msg').style.display = 'block';
            vacios[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
            if (window.navigator && window.navigator.vibrate) window.navigator.vibrate([100, 50, 100]);
            return;
        }
        calificarExamen();
    }

    function calificarExamen() {
        let nota = 0, questionIndex = 1, itemsHTML = "";
        examData.sections.forEach(section => {
            section.questions.forEach(q => {
                let uVal = q.type === 'choice' ? document.querySelector(`input[name="${q.id}"]:checked`).value : document.getElementById(q.id).value.trim();
                let cleanU = uVal.toLowerCase().replace(/['’]/g, "'").replace(/[.?!,]/g, "").replace(/\s+/g, ' ').trim();
                let cleanC = q.correct.toLowerCase().replace(/['’]/g, "'").replace(/[.?!,]/g, "").replace(/\s+/g, ' ').trim();
                
                let esOk = (cleanU === cleanC);
                if (!esOk && q.type === 'write') {
                    if (q.id === 'ref10' && (cleanU === 'my grandpa likes corn' || cleanU === 'grandpa likes corn')) esOk = true;
                    if (cleanU === cleanC) esOk = true;
                }

                if (esOk) nota++;
                itemsHTML += `<div class="item-revision" style="border-left:8px solid ${esOk?'#27ae60':'#e74c3c'}">
                    <p><strong>Question ${questionIndex}: ${q.question}</strong></p>
                    <p style="font-size:0.85em; color:#666;">🇵🇪 ${q.es}</p>
                    <p>Tu respuesta: <span class="resp-usuario">${uVal}</span> ${esOk?'✅':'❌'}</p>
                    ${!esOk?`<p class="resp-correcta">Respuesta esperada: ${q.correct}</p>`:''}
                    <p class="explicacion">📌 Explicación gramatical: ${q.feedback}</p>
                    <p class="tip-pizarra">💡 Tip de Pizarra: ${q.tip}</p>
                    ${logDudas[q.id]>2?`<p style="color:#e67e22; font-weight:bold; font-size:0.9em; margin-top:5px;">⚠️ Atención: Dudaste aquí. ¡Recuerda la regla de la 'S'!</p>`:''}
                </div>`;
                questionIndex++;
            });
        });
        const finalScore = Math.round((nota / 40) * 20);
        const rb = document.getElementById('result-box');
        rb.style.display = 'block';
        document.getElementById('score-text').innerText = `Puntaje de Refuerzo: ${finalScore} / 20 (${nota} de 40 aciertos)`;
        document.getElementById('lista-items').innerHTML = itemsHTML;
        rb.className = finalScore >= 11 ? "correct-box" : "error-box";
        document.getElementById('feedback-content').innerHTML = finalScore >= 14 ? "<h4>🌟 ¡Excelente dominio de la regla de la 'S', Edward! Estás 100% listo para tu examen de mañana.</h4>" : "<h4>📚 ¡Buen entrenamiento, Edward! Repasa los tips de pizarra de las preguntas que salieron en rojo.</h4>";
        localStorage.clear();
        window.scrollTo({ top: rb.offsetTop, behavior: 'smooth' });
    }

    window.onload = renderQuiz;
</script>
