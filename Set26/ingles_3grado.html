<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>Examen TOEFL Jr. 360° English - III Bimestre</title>
    <style>
        :root {
            --primary: #8e44ad;
            --primary-dark: #6c3483;
            --accent: #f39c12;
            --bg-color: #f7f3f9;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --border: #e2d9eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Comic Sans MS', 'Comic Neue', cursive, sans-serif;
            background-color: var(--bg-color);
            padding: 15px;
            color: var(--text);
        }

        .container {
            max-width: 950px;
            margin: auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 6px solid var(--primary);
            position: relative;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-nav-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            background: #ffffff;
            color: var(--primary-dark);
            border: 2px solid var(--primary-dark);
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.95em;
            transition: all 0.2s ease;
        }

        .back-nav-button:hover {
            background: var(--primary);
            color: #ffffff;
            transform: scale(1.03);
        }

        h1 {
            text-align: center;
            color: var(--primary-dark);
            text-transform: uppercase;
            font-size: 1.8em;
            margin: 0 0 5px 0;
        }

        h2 {
            text-align: center;
            color: #7f8c8d;
            font-size: 1.05em;
            margin-bottom: 25px;
        }

        .section-header {
            position: sticky;
            top: 10px;
            background: var(--primary);
            color: #fff;
            padding: 12px 20px;
            border-radius: 12px;
            margin: 25px 0 15px 0;
            font-size: 1.1em;
            font-weight: bold;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(142, 68, 173, 0.3);
        }

        .main-layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .questions-column {
            flex: 1;
        }

        .visual-side-card {
            width: 210px;
            background: #fbf5fc;
            border: 3px dashed var(--primary);
            border-radius: 18px;
            padding: 15px;
            text-align: center;
            position: sticky;
            top: 75px;
            box-sizing: border-box;
        }

        .visual-emoji {
            font-size: 4em;
            display: block;
            margin-bottom: 8px;
            animation: floatAnim 3s ease-in-out infinite;
        }

        .visual-tag {
            background: var(--primary);
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: bold;
            display: inline-block;
        }

        @keyframes floatAnim {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        .section {
            margin-bottom: 15px;
            padding: 16px;
            border: 2px solid var(--border);
            border-radius: 15px;
            background-color: #ffffff;
            transition: border-color 0.3s;
        }

        .incomplete {
            border: 2px solid #e74c3c !important;
            background-color: #fff8f8 !important;
        }

        .question-title {
            font-weight: bold;
            color: #2c3e50;
            display: block;
            font-size: 1.05em;
            line-height: 1.4;
        }

        .question-translation {
            display: block;
            font-size: 0.88em;
            color: #7f8c8d;
            font-style: italic;
            margin: 4px 0 12px 0;
        }

        .reading-box {
            background: #fffdf5;
            border: 2px solid #f1c40f;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            font-size: 0.95em;
            line-height: 1.5;
            color: #34495e;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 2px solid #cbd5e1;
            font-size: 15px;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        .options label {
            display: block;
            margin: 8px 0;
            cursor: pointer;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #fafafa;
            transition: all 0.2s ease;
        }

        .options label:hover {
            background: #fbf5fc;
            border-color: var(--primary);
        }

        .powerup-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: bold;
            box-shadow: 0 4px #d35400;
        }

        .powerup-btn:disabled {
            background: #bdc3c7;
            box-shadow: none;
            cursor: not-allowed;
        }

        button#btn-evaluar {
            display: block;
            width: 100%;
            max-width: 320px;
            height: 55px;
            margin: 30px auto;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px var(--primary-dark);
            transition: transform 0.1s;
        }

        button#btn-evaluar:active {
            transform: translateY(3px);
            box-shadow: 0 2px var(--primary-dark);
        }

        #result-box {
            display: none;
            padding: 25px;
            border-radius: 20px;
            margin-top: 30px;
            border: 3px solid;
        }

        .correct-box {
            background: #f0fff4;
            color: #27ae60;
            border-color: #2ecc73;
        }

        .error-box {
            background: #fffdf0;
            color: #d35400;
            border-color: #f39c12;
        }

        .revision-container {
            margin-top: 20px;
            background: white;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid var(--border);
        }

        .item-revision {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 8px;
            border-left: 6px solid #ccc;
            background: #fafafa;
        }

        .resp-correcta {
            color: #27ae60;
            font-weight: bold;
        }

        .resp-usuario {
            font-style: italic;
            color: #555;
        }

        .explicacion {
            color: #2980b9;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .tip-pizarra {
            color: #d35400;
            font-size: 0.88em;
            margin-top: 6px;
            background: #fff3e0;
            padding: 6px 10px;
            border-radius: 6px;
        }

        .missing-alert {
            color: #e74c3c;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
            display: none;
            padding: 12px;
            background: #fdf2f2;
            border-radius: 10px;
            border: 2px solid #e74c3c;
        }

        .diagram-container {
            margin: 15px 0;
            background: #fafbfc;
            border: 2px dashed #b2bec3;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .diagram-svg {
            max-width: 100%;
            height: auto;
        }

        @media(max-width: 800px) {
            .main-layout {
                flex-direction: column;
            }
            .visual-side-card {
                width: 100%;
                position: static;
                margin-bottom: 15px;
            }
        }
    </style>
</head>

    let comodinUsado = false;
    let logDudas = {};

    function trackDuda(id) {
        logDudas[id] = (logDudas[id] || 0) + 1;
        if (window.navigator && window.navigator.vibrate) {
            window.navigator.vibrate(20);
        }
    }

    function renderQuiz() {
        const container = document.getElementById('quizContainer');
        let questionCounter = 1;
        examData.sections.forEach(section => {
            const header = document.createElement('div');
            header.className = 'section-header';
            header.innerText = section.title;
            container.appendChild(header);

            const layoutDiv = document.createElement('div');
            layoutDiv.className = 'main-layout';

            const questionsColumn = document.createElement('div');
            questionsColumn.className = 'questions-column';

            section.questions.forEach(q => {
                const secDiv = document.createElement('div');
                secDiv.className = 'section';
                secDiv.id = 'sec_' + q.id;

                const titleSpan = document.createElement('span');
                titleSpan.className = 'question-title';
                titleSpan.innerText = `${questionCounter}. ${q.question}`;
                secDiv.appendChild(titleSpan);

                const transSpan = document.createElement('span');
                transSpan.className = 'question-translation';
                transSpan.innerText = `🇵🇪 Traducción: ${q.es}`;
                secDiv.appendChild(transSpan);

                // SVGs inline para soporte visual
                if (q.hasDiagram) {
                    const diagDiv = document.createElement('div');
                    diagDiv.className = 'diagram-container';

                    if (q.hasDiagram === 'label') {
                        diagDiv.innerHTML = `
                            <svg class="diagram-svg" width="200" height="110" viewBox="0 0 200 110">
                                <rect x="20" y="10" width="160" height="90" rx="8" fill="#fff" stroke="#8e44ad" stroke-width="3"/>
                                <rect x="25" y="15" width="150" height="25" fill="#8e44ad" rx="4"/>
                                <text x="100" y="32" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">FOOD LABEL</text>
                                <text x="100" y="58" font-size="11" fill="#333" text-anchor="middle">Contains: Wheat & Nuts</text>
                                <text x="100" y="80" font-size="10" fill="#e74c3c" font-weight="bold" text-anchor="middle">⚠️ ALLERGY ADVICE</text>
                            </svg>
                        `;
                    } else if (q.hasDiagram === 'readingLucy') {
                        diagDiv.innerHTML = `
                            <svg class="diagram-svg" width="220" height="100" viewBox="0 0 220 100">
                                <circle cx="50" cy="50" r="30" fill="#fed330"/>
                                <text x="50" y="56" font-size="24" text-anchor="middle">👧</text>
                                <rect x="95" y="20" width="115" height="60" rx="8" fill="#f5f6fa" stroke="#dcdde1"/>
                                <text x="105" y="42" font-size="11" font-weight="bold" fill="#2f3640">Lucy's Story</text>
                                <text x="105" y="62" font-size="10" fill="#718093">Likes: Cheese & Fruit</text>
                            </svg>
                        `;
                    } else if (q.hasDiagram === 'readingDan') {
                        diagDiv.innerHTML = `
                            <svg class="diagram-svg" width="220" height="100" viewBox="0 0 220 100">
                                <circle cx="50" cy="50" r="30" fill="#45aaf2"/>
                                <text x="50" y="56" font-size="24" text-anchor="middle">👦</text>
                                <rect x="95" y="20" width="115" height="60" rx="8" fill="#f5f6fa" stroke="#dcdde1"/>
                                <text x="105" y="42" font-size="11" font-weight="bold" fill="#2f3640">Dan's Story</text>
                                <text x="105" y="62" font-size="10" fill="#718093">Likes: Fish & Prawns</text>
                            </svg>
                        `;
                    }
                    secDiv.appendChild(diagDiv);
                }

                if (q.type === 'choice') {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'options';
                    optDiv.id = 'opts_' + q.id;
                    q.options.forEach(opt => {
                        const lbl = document.createElement('label');
                        lbl.innerHTML = `<input type="radio" name="${q.id}" value="${opt}" onclick="trackDuda('${q.id}'); saveProgress('${q.id}', '${opt}')"> ${opt}`;
                        optDiv.appendChild(lbl);
                    });
                    secDiv.appendChild(optDiv);
                } else {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.id = q.id;
                    input.placeholder = 'Type your answer in English here...';
                    input.oninput = function() { trackDuda(q.id); saveProgress(q.id, this.value); };
                    secDiv.appendChild(input);
                }
                questionsColumn.appendChild(secDiv);
                questionCounter++;
            });

            const visualCard = document.createElement('div');
            visualCard.className = 'visual-side-card';
            visualCard.innerHTML = `<span class="visual-emoji">${section.emoji}</span><span class="visual-tag">${section.tag}</span><p style="font-size:0.85em; color:#555; margin-top:10px;">¡Vamos Edward! Revisa cada oración, recuerda la "s" en He/She y lee bien las preguntas.</p>`;
            layoutDiv.appendChild(questionsColumn);
            layoutDiv.appendChild(visualCard);
            container.appendChild(layoutDiv);
        });
        loadSavedProgress();
    }

    function saveProgress(id, val) {
        localStorage.setItem('ingles_exam_3b_' + id, val);
        document.getElementById('sec_' + id).classList.remove('incomplete');
        if(document.querySelectorAll('.incomplete').length === 0) document.getElementById('missing-msg').style.display='none';
    }

    function loadSavedProgress() {
        examData.sections.forEach(section => {
            section.questions.forEach(q => {
                const saved = localStorage.getItem('ingles_exam_3b_' + q.id);
                if (saved) {
                    if (q.type === 'choice') {
                        const radio = document.querySelector(`input[name="${q.id}"][value="${saved}"]`);
                        if (radio) radio.checked = true;
                    } else {
                        const txtInput = document.getElementById(q.id);
                        if (txtInput) txtInput.value = saved;
                    }
                }
            });
        });
    }

    function usarCincuentaCincuentaGlobal() {
        if (comodinUsado) return;
        let seleccionada = prompt("Edward, escribe el número de la pregunta de opción múltiple (1 al 40) donde quieras descartar una alternativa incorrecta:");
        let qNum = parseInt(seleccionada);
        if (isNaN(qNum) || qNum < 1 || qNum > 40) return;
        let currentIdx = 1, targetId = null, targetQObj = null;
        for (let s of examData.sections) {
            for (let q of s.questions) {
                if (currentIdx === qNum) { targetId = q.id; targetQObj = q; break; }
                currentIdx++;
            }
            if (targetId) break;
        }
        if (!targetQObj || targetQObj.type !== 'choice') {
            alert("Esa pregunta es de escritura o no es válida. Elige una de alternativas.");
            return;
        }
        let labels = document.getElementById('opts_' + targetId).querySelectorAll('label');
        let incorrectasBorradas = 0;
        labels.forEach(lbl => {
            let radio = lbl.querySelector('input');
            if (radio.value !== targetQObj.correct && incorrectasBorradas < 1) { 
                lbl.style.display = 'none'; 
                incorrectasBorradas++; 
            }
        });
        comodinUsado = true;
        document.getElementById('global-5050').disabled = true;
        document.getElementById('global-5050').innerText = "⚡ Comodín 50/50 Usado";
        if (window.navigator && window.navigator.vibrate) window.navigator.vibrate([40, 40, 40]);
    }

    function validarExamen() {
        let vacios = [];
        examData.sections.forEach(section => {
            section.questions.forEach(q => {
                let r = q.type === 'choice' ? document.querySelector(`input[name="${q.id}"]:checked`) : document.getElementById(q.id).value.trim();
                if (!r) { const c = document.getElementById('sec_' + q.id); c.classList.add('incomplete'); vacios.push(c); }
            });
        });
        if (vacios.length > 0) {
            document.getElementById('missing-msg').style.display = 'block';
            vacios[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
            if (window.navigator && window.navigator.vibrate) window.navigator.vibrate([100, 50, 100]);
            return;
        }
        calificarExamen();
    }

    function calificarExamen() {
        let nota = 0, questionIndex = 1, itemsHTML = "";
        examData.sections.forEach(section => {
            section.questions.forEach(q => {
                let uVal = q.type === 'choice' ? document.querySelector(`input[name="${q.id}"]:checked`).value : document.getElementById(q.id).value.trim();
                let cleanU = uVal.toLowerCase().replace(/['’]/g, "'").replace(/[.?!,]/g, "").replace(/\s+/g, ' ').trim();
                let cleanC = q.correct.toLowerCase().replace(/['’]/g, "'").replace(/[.?!,]/g, "").replace(/\s+/g, ' ').trim();
                
                let esOk = (cleanU === cleanC);
                // Flexibilidad controlada para respuestas de escritura equivalentes
                if (!esOk && q.type === 'write') {
                    if (q.id === 'eng40' && (cleanU === 'joe likes pie' || cleanU === 'he likes pie')) esOk = true;
                    if (q.id === 'eng17' && cleanU.includes('like') && cleanU.includes("don't")) esOk = true;
                    if (cleanU === cleanC) esOk = true;
                }

                if (esOk) nota++;
                itemsHTML += `<div class="item-revision" style="border-left:8px solid ${esOk?'#27ae60':'#e74c3c'}">
                    <p><strong>Question ${questionIndex}: ${q.question}</strong></p>
                    <p style="font-size:0.85em; color:#666;">🇵🇪 ${q.es}</p>
                    <p>Your answer: <span class="resp-usuario">${uVal}</span> ${esOk?'✅':'❌'}</p>
                    ${!esOk?`<p class="resp-correcta">Expected Answer: ${q.correct}</p>`:''}
                    <p class="explicacion">📌 Grammar & Explanation: ${q.feedback}</p>
                    <p class="tip-pizarra">💡 Tip de Pizarra: ${q.tip}</p>
                    ${logDudas[q.id]>2?`<p style="color:#e67e22; font-weight:bold; font-size:0.9em; margin-top:5px;">⚠️ Atención: Cambiaste de respuesta varias veces en esta pregunta. ¡Repasa la regla!</p>`:''}
                </div>`;
                questionIndex++;
            });
        });
        const finalScore = Math.round((nota / 40) * 20);
        const rb = document.getElementById('result-box');
        rb.style.display = 'block';
        document.getElementById('score-text').innerText = `Puntaje Final: ${finalScore} / 20 (${nota} de 40 aciertos)`;
        document.getElementById('lista-items').innerHTML = itemsHTML;
        rb.className = finalScore >= 11 ? "correct-box" : "error-box";
        document.getElementById('feedback-content').innerHTML = finalScore >= 11 ? "<h4>🌟 Outstanding job, Edward! You are doing awesome in English!</h4>" : "<h4>📚 Good effort, Edward! Let's review the blackboard tips to master your writing.</h4>";
        localStorage.clear();
        window.scrollTo({ top: rb.offsetTop, behavior: 'smooth' });
    }

    window.onload = renderQuiz;
</script>
