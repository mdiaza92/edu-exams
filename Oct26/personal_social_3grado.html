        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .back-nav-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            background: #ffffff;
            color: var(--primary-dark);
            border: 2px solid var(--primary-dark);
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.95em;
            transition: all 0.2s ease;
        }

        .back-nav-button:hover {
            background: var(--primary);
            color: #ffffff;
            transform: scale(1.03);
        }

        h1 {
            text-align: center;
            color: #b94a00;
            text-transform: uppercase;
            font-size: 1.75em;
            margin: 0 0 5px 0;
        }

        h2 {
            text-align: center;
            color: #7f8c8d;
            font-size: 1.05em;
            margin-bottom: 25px;
        }

        .section-header {
            position: sticky;
            top: 10px;
            background: var(--primary);
            color: #fff;
            padding: 12px 20px;
            border-radius: 12px;
            margin: 25px 0 15px 0;
            font-size: 1.1em;
            font-weight: bold;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(230, 126, 34, 0.3);
        }

        .main-layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .questions-column {
            flex: 1;
        }

        .visual-side-card {
            width: 220px;
            background: #fef5ec;
            border: 3px dashed var(--primary);
            border-radius: 18px;
            padding: 15px;
            text-align: center;
            position: sticky;
            top: 75px;
            box-sizing: border-box;
        }

        }

            background: var(--primary);
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.82em;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }

            margin: 8px 0;
            background: #ffffff;
            border: 2px dashed #e67e22;
            border-radius: 12px;
            padding: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .diagram-svg {
            max-width: 100%;
            height: auto;
        }

        @keyframes floatAnim {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        .section {
            margin-bottom: 15px;
            padding: 18px;
            border: 2px solid var(--border);
            border-radius: 15px;
            background-color: #ffffff;
            transition: all 0.2s ease;
        }

        .section:hover {
            border-color: #cbd5e1;
        }

        .incomplete {
            border: 3px solid #e74c3c !important;
            background-color: #fff5f5 !important;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .question-title {
            font-weight: bold;
            margin-bottom: 12px;
            color: #2f3542;
            display: block;
            line-height: 1.4;
            font-size: 1.03em;

            font-size: 16px;
            font-family: inherit;
            box-sizing: border-box;
            background: #fdfdfd;

            border-color: var(--primary);
            background: #ffffff;

            border-radius: 10px;

            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9em;

            cursor: not-allowed;

            height: 55px;
            margin: 30px auto;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;

        }

        #result-box {
            display: none;
            padding: 25px;
            border-radius: 20px;
            margin-top: 30px;
            border: 3px solid;
        }

        .correct-box {
            background: #fdfaf6;
            color: #27ae60;
            border-color: #2ecc71;
        }

        .error-box {
            background: #fffdf0;
            color: #d35400;
            border-color: #f39c12;
        }

        .revision-container {
            margin-top: 20px;
            background: white;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid var(--border);
        }

        .item-revision {
            margin-bottom: 15px;

            border-radius: 8px;
            border-left: 6px solid #ccc;
            background: #fafafa;
        }

        .resp-correcta {
            color: #27ae60;
            font-weight: bold;
        }

        .resp-usuario {
            font-style: italic;
            color: #555;
        }

        .explicacion {
            color: var(--accent);
            font-size: 0.9em;
            margin-top: 6px;
        }

        .tip-box {
            background: #eafaf1;

            border-radius: 6px;

            margin-top: 6px;
            color: #27ae60;

            padding: 12px;

</head>

    let comodinUsado = false;
    let logDudas = {};

    function trackDuda(id) { 
        logDudas[id] = (logDudas[id] || 0) + 1; 
    }

    function renderQuiz() {
        const container = document.getElementById('quizContainer');
        let questionCounter = 1;
        examData.sections.forEach(section => {
            const header = document.createElement('div');
            header.className = 'section-header';
            header.innerText = section.title;
            container.appendChild(header);

            const layoutDiv = document.createElement('div');
            layoutDiv.className = 'main-layout';

            const questionsColumn = document.createElement('div');
            questionsColumn.className = 'questions-column';

            section.questions.forEach(q => {
                const secDiv = document.createElement('div');
                secDiv.className = 'section';
                secDiv.id = 'sec_' + q.id;

                const titleSpan = document.createElement('span');
                titleSpan.className = 'question-title';
                titleSpan.innerText = `${questionCounter}. ${q.question}`;
                secDiv.appendChild(titleSpan);

                if (q.type === 'choice') {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'options';
                    optDiv.id = 'opts_' + q.id;
                    q.options.forEach(opt => {
                        const lbl = document.createElement('label');
                        lbl.innerHTML = `<input type="radio" name="${q.id}" value="${opt}" onclick="trackDuda('${q.id}'); saveProgress('${q.id}', '${opt}')"> <span>${opt}</span>`;
                        optDiv.appendChild(lbl);
                    });
                    secDiv.appendChild(optDiv);
                } else {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.id = q.id;
                    input.placeholder = 'Escribe tu respuesta aquí...';
                    input.oninput = function() { 
                        trackDuda(q.id); 
                        saveProgress(q.id, this.value); 
                    };
                    secDiv.appendChild(input);
                }
                questionsColumn.appendChild(secDiv);
                questionCounter++;
            });

            const visualCard = document.createElement('div');
            visualCard.className = 'visual-side-card';
            visualCard.innerHTML = `
                <span class="visual-emoji">${section.emoji}</span>
                <span class="visual-tag">${section.tag}</span>
                <div class="diagram-container">${section.svg}</div>
                <p style="font-size:0.85em; color:#555; margin-top:8px;">¡Demuestra tu talento en el Colegio San Luis, Edward!</p>
            `;

            layoutDiv.appendChild(questionsColumn);
            layoutDiv.appendChild(visualCard);
            container.appendChild(layoutDiv);
        });
        loadSavedProgress();
    }

    function saveProgress(id, val) {
        localStorage.setItem('exam_oct26_ps_' + id, val);
        const sec = document.getElementById('sec_' + id);
        if (sec) sec.classList.remove('incomplete');
        if (document.querySelectorAll('.incomplete').length === 0) {
            document.getElementById('missing-msg').style.display = 'none';
        }
    }

    function loadSavedProgress() {
        examData.sections.forEach(section => {
            section.questions.forEach(q => {
                const saved = localStorage.getItem('exam_oct26_ps_' + q.id);
                if (saved) {
                    if (q.type === 'choice') {
                        const radio = document.querySelector(`input[name="${q.id}"][value="${saved}"]`);
                        if (radio) radio.checked = true;
                    } else {
                        const txtInput = document.getElementById(q.id);
                        if (txtInput) txtInput.value = saved;
                    }
                }
            });
        });
    }

    function usarCincuentaCincuentaGlobal() {
        if (comodinUsado) return;
        let seleccionada = prompt("Edward, introduce el número de pregunta (1-40) donde deseas descartar una opción incorrecta:");
        let qNum = parseInt(seleccionada);
        if (isNaN(qNum) || qNum < 1 || qNum > 40) {
            alert("Por favor ingresa un número de pregunta válido entre 1 y 40.");
            return;
        }
        let currentIdx = 1, targetId = null, targetQObj = null;
        for (let s of examData.sections) {
            for (let q of s.questions) {
                if (currentIdx === qNum) { 
                    targetId = q.id; 
                    targetQObj = q; 
                    break; 
                }
                currentIdx++;
            }
            if (targetId) break;
        }
        if (!targetQObj || targetQObj.type !== 'choice') {
            alert("El comodín solo aplica para preguntas de opción múltiple.");
            return;
        }
        let labels = document.getElementById('opts_' + targetId).querySelectorAll('label');
        let incorrectasBorradas = 0;
        labels.forEach(lbl => {
            let radio = lbl.querySelector('input');
            if (radio.value !== targetQObj.correct && incorrectasBorradas < 1) { 
                lbl.style.display = 'none'; 
                incorrectasBorradas++; 
            }
        });
        comodinUsado = true;
        const btn = document.getElementById('global-5050');
        btn.disabled = true;
        btn.innerText = "⚡ Súper Poder Usado";
    }

    function validarExamen() {
        let vacios = [];
        examData.sections.forEach(section => {
            section.questions.forEach(q => {
                let r = q.type === 'choice' ? document.querySelector(`input[name="${q.id}"]:checked`) : document.getElementById(q.id).value.trim();
                if (!r) { 
                    const c = document.getElementById('sec_' + q.id); 
                    c.classList.add('incomplete'); 
                    vacios.push(c); 
                }
            });
        });

        if (vacios.length > 0) { 
            if (navigator.vibrate) {
                navigator.vibrate([100, 50, 100]);
            }
            document.getElementById('missing-msg').style.display = 'block'; 
            vacios[0].scrollIntoView({ behavior: 'smooth', block: 'center' }); 
            return; 
        }
        calificarExamen();
    }

    function calificarExamen() {
        let nota = 0, questionIndex = 1, itemsHTML = "";
        examData.sections.forEach(section => {
            section.questions.forEach(q => {
                let uVal = q.type === 'choice' ? document.querySelector(`input[name="${q.id}"]:checked`).value : document.getElementById(q.id).value.trim();
                let cleanU = uVal.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[.?!,']/g, "").replace(/\s+/g, ' ').trim();
                let cleanC = q.correct.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[.?!,']/g, "").replace(/\s+/g, ' ').trim();
                let esOk = (cleanU === cleanC) || (q.type === 'write' && cleanU.includes(cleanC));
                
                if (esOk) nota++;

                itemsHTML += `
                    <div class="item-revision" style="border-left:8px solid ${esOk ? '#27ae60' : '#e74c3c'}">
                        <p><strong>Pregunta ${questionIndex}: ${q.question}</strong></p>
                        <p>Tu respuesta: <span class="resp-usuario">${uVal}</span> ${esOk ? '✅' : '❌'}</p>
                        ${!esOk ? `<p class="resp-correcta">Respuesta Correcta: ${q.correct}</p>` : ''}
                        <p class="explicacion">💡 Pizarra didáctica: ${q.feedback}</p>
                        <div class="tip-box">${q.tip}</div>
                        ${logDudas[q.id] > 2 ? `<p style="color:#e67e22; font-weight:bold; font-size:0.88em; margin-top:5px;">⚠️ Se detectaron varias correcciones en esta pregunta. ¡Repasa bien este concepto!</p>` : ''}
                    </div>
                `;
                questionIndex++;
            });
        });

        const finalScore = Math.round((nota / 40) * 20);
        const rb = document.getElementById('result-box');
        rb.style.display = 'block';
        document.getElementById('score-text').innerText = `Calificación Final: ${finalScore} / 20 (${nota} de 40 aciertos)`;
        document.getElementById('lista-items').innerHTML = itemsHTML;
        rb.className = finalScore >= 11 ? "correct-box" : "error-box";

        let mensajeMotivacional = "";
        if (finalScore >= 18) {
            mensajeMotivacional = "<h4>🌟 ¡Extraordinario, Edward! Dominas los continentes, océanos, primeros pobladores y las grandes culturas preíncas del Perú. ¡Sigue así, campeón!</h4>";
        } else if (finalScore >= 14) {
            mensajeMotivacional = "<h4>👏 ¡Muy buen trabajo, Edward! Tienes claros los conceptos principales. Revisa los tips verdes para lograr el 20 perfecto.</h4>";
        } else {
            mensajeMotivacional = "<h4>📚 ¡Buen esfuerzo, Edward! Repasa los restos arqueológicos de cada cultura y la geografía con la pizarra de repaso.</h4>";
        }
        document.getElementById('feedback-content').innerHTML = mensajeMotivacional;

        examData.sections.forEach(section => {
            section.questions.forEach(q => {
                localStorage.removeItem('exam_oct26_ps_' + q.id);
            });
        });

        window.scrollTo({ top: rb.offsetTop, behavior: 'smooth' });
    }

    window.onload = renderQuiz;

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(() => {});
        });
    }
